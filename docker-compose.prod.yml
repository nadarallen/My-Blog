services:

  # ──────────────────────────────────────────
  # Nginx: Public-facing reverse proxy (port 80)
  # ──────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: myblog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro      # Nginx serves static files directly
    depends_on:
      - app
    networks:
      - myblog-net

  # ──────────────────────────────────────────
  # Flask App: Gunicorn WSGI server (internal)
  # ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myblog-app
    restart: unless-stopped
    env_file:
      - .env.production             # copy from .env.production.example
    networks:
      - myblog-net

networks:
  myblog-net:
    driver: bridge
