{% extends "base.html" %}

{% block title %}Register — My Blog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="form-card-container">
            <h2 class="form-title text-center mb-4">Start Writing</h2>
            
            <form method="POST" class="doodle-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <!-- Username -->
                <div class="form-group mb-4">
                    <label for="username" class="form-label-custom">Username</label>
                    <input type="text" id="username" name="username" required value="{{ username or '' }}" placeholder="Pick a username..." class="form-input-custom" autocomplete="username">
                    <div class="form-text text-muted small">3 to 32 chars. Letters, digits and underscores only.</div>
                </div>

                <!-- Password -->
                <div class="form-group mb-4">
                    <label for="password" class="form-label-custom">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Choose a strong password..." class="form-input-custom" autocomplete="new-password">
                    <div class="form-text text-muted small">At least 8 chars, 1 letter, and 1 digit. Max 72 chars.</div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group mb-4">
                    <label for="confirm_password" class="form-label-custom">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-enter password..." class="form-input-custom" autocomplete="new-password">
                </div>

                <!-- Action Button -->
                <button type="submit" class="btn-doodle w-100 mb-3 d-inline-flex align-items-center justify-content-center gap-2">
                    <span>Create Account</span>
                    <svg class="icon-svg icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                </button>
                
                <!-- Footer Redirect -->
                <div class="text-center small mt-3">
                    <span class="text-muted">Already have a pen?</span> 
                    <a href="{{ url_for('auth.login') }}" class="btn-doodle-link">Log In Here</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
