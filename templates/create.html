{% extends "base.html" %}

{% block title %}Create New Story — My-Blog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card-doodle p-4">
            <h2 class="mb-4 d-flex align-items-center gap-2">
                <svg class="icon-svg icon-lg text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                <span>Write a New Story</span>
            </h2>

            <form method="POST" action="{{ url_for('posts.create') }}" enctype="multipart/form-data" id="editorForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="title" class="form-label font-weight-bold">Story Title</label>
                    <input type="text" class="form-control form-control-doodle" id="title" name="title" placeholder="Enter a catchy title..." required maxlength="200" value="{{ title or '' }}">
                </div>

                <div class="mb-3">
                    <label for="subtitle" class="form-label font-weight-bold">Subtitle / Excerpt</label>
                    <input type="text" class="form-control form-control-doodle" id="subtitle" name="subtitle" placeholder="Short description or summary..." maxlength="300">
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="category_slug" class="form-label font-weight-bold">Category</label>
                        <select class="form-select form-control-doodle" id="category_slug" name="category_slug">
                            {% for cat in categories %}
                                <option value="{{ cat.slug }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="tags" class="form-label font-weight-bold">Tags (comma-separated)</label>
                        <input type="text" class="form-control form-control-doodle" id="tags" name="tags" placeholder="python, aws, security">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="image" class="form-label font-weight-bold">Cover Image (Optional)</label>
                    <input type="file" class="form-control form-control-doodle" id="image" name="image" accept="image/png, image/jpeg, image/gif, image/webp">
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label for="content" class="form-label font-weight-bold mb-0">Story Content (Markdown)</label>
                        <button type="button" class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1" id="togglePreviewBtn">
                            <svg class="icon-svg icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            <span>Live Preview</span>
                        </button>
                    </div>

                    <div id="editorPane">
                        <textarea class="form-control form-control-doodle" id="content" name="content" rows="12" placeholder="Write your story using Markdown..." required>{{ content or '' }}</textarea>
                    </div>

                    <div id="previewPane" class="doodle-preview-box p-3 border rounded mt-2 d-none">
                        <div id="previewContent"><em>Nothing to preview...</em></div>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-4">
                        <label for="status" class="form-label font-weight-bold">Status</label>
                        <select class="form-select form-control-doodle" id="status" name="status">
                            <option value="published" selected>Publish Immediately</option>
                            <option value="draft">Save as Draft</option>
                            <option value="scheduled">Schedule Publication</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="visibility" class="form-label font-weight-bold">Visibility</label>
                        <select class="form-select form-control-doodle" id="visibility" name="visibility">
                            <option value="public" selected>Public</option>
                            <option value="unlisted">Unlisted</option>
                            <option value="private">Private</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="scheduled_at" class="form-label font-weight-bold">Schedule Date/Time</label>
                        <input type="datetime-local" class="form-control form-control-doodle" id="scheduled_at" name="scheduled_at">
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <a href="{{ url_for('posts.index') }}" class="btn-doodle-secondary">Cancel</a>
                    <button type="submit" class="btn-doodle-primary d-inline-flex align-items-center gap-2">
                        <span>Publish Story</span>
                        <svg class="icon-svg icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    const contentArea = document.getElementById('content');
    const toggleBtn = document.getElementById('togglePreviewBtn');
    const previewPane = document.getElementById('previewPane');
    const previewContent = document.getElementById('previewContent');

    toggleBtn.addEventListener('click', () => {
        if (previewPane.classList.contains('d-none')) {
            // Render Live Preview
            const formData = new FormData();
            formData.append('content', contentArea.value);
            formData.append('csrf_token', '{{ csrf_token() }}');

            fetch('{{ url_for("posts.preview_markdown") }}', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                previewContent.innerHTML = data.html || '<em>Empty content...</em>';
                previewPane.classList.remove('d-none');
                toggleBtn.innerHTML = '<svg class="icon-svg icon-xs me-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>Edit Mode';
            });
        } else {
            previewPane.classList.add('d-none');
            toggleBtn.innerHTML = '<svg class="icon-svg icon-xs me-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>Live Preview';
        }
    });
</script>
{% endblock %}
