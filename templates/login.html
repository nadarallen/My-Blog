{% extends "base.html" %}

{% block title %}Login — My Blog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="form-card-container">
            <h2 class="form-title text-center mb-4">Welcome Back</h2>
            
            <form method="POST" class="doodle-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
                
                <!-- Username -->
                <div class="form-group mb-4">
                    <label for="username" class="form-label-custom">Username</label>
                    <input type="text" id="username" name="username" required value="{{ username or '' }}" placeholder="Enter username..." class="form-input-custom" autocomplete="username">
                </div>

                <!-- Password -->
                <div class="form-group mb-4">
                    <label for="password" class="form-label-custom">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter password..." class="form-input-custom" autocomplete="current-password">
                </div>

                <!-- Action Button -->
                <button type="submit" class="btn-doodle w-100 mb-3 d-inline-flex align-items-center justify-content-center gap-2">
                    <span>Sign In</span>
                    <svg class="icon-svg icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                </button>
                
                <!-- Footer Redirect -->
                <div class="text-center small mt-3">
                    <span class="text-muted">New storyteller?</span> 
                    <a href="{{ url_for('auth.register', next=request.args.get('next', '')) }}" class="btn-doodle-link">Create an Account</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% block extra_head %}
<!-- In production rate-limit applies, login rate limit error handles inside auth.py -->
{% endblock %}
{% endblock %}
