{% extends "base.html" %}

{% block title %}Site Settings — Admin — My-Blog{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-3 mb-4">
        <div class="card-doodle p-3">
            <h5 class="mb-3">🛡️ Admin Console</h5>
            <div class="list-group list-group-flush">
                <a href="{{ url_for('admin.dashboard') }}" class="list-group-item list-group-item-action">Overview</a>
                <a href="{{ url_for('admin.manage_users') }}" class="list-group-item list-group-item-action">Users & Roles</a>
                <a href="{{ url_for('admin.manage_posts') }}" class="list-group-item list-group-item-action">Content Moderation</a>
                <a href="{{ url_for('admin.manage_reports') }}" class="list-group-item list-group-item-action">Reports Queue</a>
                <a href="{{ url_for('admin.manage_settings') }}" class="list-group-item list-group-item-action active fw-bold">Site Settings</a>
                <a href="{{ url_for('admin.audit_logs') }}" class="list-group-item list-group-item-action">Security Audit Logs</a>
            </div>
        </div>
    </div>

    <div class="col-lg-9">
        <div class="card-doodle p-4">
            <h2 class="mb-4">⚙️ Platform Settings & Feature Flags</h2>

            <form method="POST" action="{{ url_for('admin.manage_settings') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="site_name" class="form-label font-weight-bold">Site Title</label>
                    <input type="text" class="form-control form-control-doodle" id="site_name" name="site_name" value="{{ settings.site_name or '' }}" required>
                </div>

                <div class="mb-3">
                    <label for="site_description" class="form-label font-weight-bold">Site Description</label>
                    <textarea class="form-control form-control-doodle" id="site_description" name="site_description" rows="2">{{ settings.site_description or '' }}</textarea>
                </div>

                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="allow_registration" name="allow_registration" {% if settings.allow_registration %}checked{% endif %}>
                    <label class="form-check-label font-weight-bold" for="allow_registration">Allow New User Registrations</label>
                </div>

                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" id="allow_comments" name="allow_comments" {% if settings.allow_comments %}checked{% endif %}>
                    <label class="form-check-label font-weight-bold" for="allow_comments">Enable Global Comments System</label>
                </div>

                <button type="submit" class="btn-doodle-primary">Save Platform Settings</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
