##############################################################
# Nginx — Production Reverse Proxy for My-Blog (Flask App)
# Mode: HTTP only (Elastic IP, no domain, no SSL)
##############################################################

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip compression
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        image/svg+xml;
    gzip_min_length 256;

    # Hide Nginx version from headers
    server_tokens off;

    # Map X-Forwarded-Proto
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Upstream Gunicorn
    upstream flask_app {
        server app:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;   # Accepts any host — works with bare Elastic IP

        # Max upload size (match Flask's 5 MB limit)
        client_max_body_size 10M;

        # Force HTTPS redirect if requested over plain HTTP behind an SSL proxy / ALB
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }

        # ── Static files served directly by Nginx (fast, no Python overhead) ──
        location /static/ {
            alias /app/static/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── All other requests proxied to Gunicorn ──
        location / {
            proxy_pass         http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $forwarded_proto;
            proxy_set_header   Connection        "";
            proxy_read_timeout    90s;
            proxy_connect_timeout 90s;
            proxy_buffering on;

            # Security headers
            add_header X-Frame-Options     "DENY"         always;
            add_header X-Content-Type-Options "nosniff"   always;
            add_header X-XSS-Protection    "1; mode=block" always;
            add_header Referrer-Policy     "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # Block hidden files (.env, .git, etc.)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
